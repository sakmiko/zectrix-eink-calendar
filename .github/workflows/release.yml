name: Linux 检查与发布

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --target x86_64-unknown-linux-gnu --bin zectrix_calendar_companion
      - name: 组装 Linux 发行包
        run: |
          mkdir -p dist
          install -m 755 target/x86_64-unknown-linux-gnu/release/zectrix_calendar_companion dist/zectrix_calendar_companion
          cp README.md .env.example LICENSE dist/
          archive=zectrix-eink-calendar-linux-x86_64-gnu.tar.gz
          tar -czf "dist/$archive" -C dist zectrix_calendar_companion README.md .env.example LICENSE
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/zectrix-eink-calendar-linux-x86_64-gnu.tar.gz dist/zectrix-eink-calendar-linux-x86_64-gnu.tar.gz.sha256 --verify-tag --generate-notes
